<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a Solar Africa account to start investing in renewable energy." />
    <meta name="theme-color" content="#0b6cff" />
    <title>Sign Up | Solar Africa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body data-page="auth">
    <div class="auth-split-wrapper">
      <div class="auth-split-visual" style="background: linear-gradient(135deg, rgba(32, 192, 48, 0.85) 0%, rgba(11, 108, 255, 0.85) 100%), url('https://images.unsplash.com/photo-1588508065123-287b28e013da?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; background-blend-mode: multiply;">
        <h2 style="color: white; font-size: 48px; font-weight: 800; margin-bottom: 24px;">Start your solar journey.</h2>
        <p style="color: rgba(255,255,255,0.9); font-size: 18px; max-width: 480px;">Create an account today to access exclusive investment packages and instant bonuses.</p>
      </div>
      <div class="auth-split-form">
        <div class="auth-card-modern">
          <div class="auth-logo">
            <img src="assets/img/logo1.png" alt="Solar Africa Logo">
            <span><span class="logo-text-blue">SOLAR</span><span class="logo-text-green">AFRICA</span></span>
          </div>
          <div class="auth-header">
            <h1>Create an account</h1>
            <p>Enter your details below to get started.</p>
          </div>
          
          <button class="btn-social">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
            Sign up with Google
          </button>
          
          <div class="auth-divider">or sign up with email</div>
          
          <form id="register-form">
            <div class="modern-form-group">
              <label for="name" class="modern-form-label">Full Name</label>
              <input type="text" id="name" name="name" class="modern-form-control" placeholder="John Doe" required />
            </div>
            <div class="modern-form-group">
              <label for="email" class="modern-form-label">Email</label>
              <input type="email" id="email" name="email" class="modern-form-control" placeholder="Enter your email" required />
            </div>
            
            <div class="modern-form-group">
              <label for="country" class="modern-form-label">Country</label>
              <select id="country" name="country" class="modern-form-control" required style="appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23131313%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto;">
                <option value="" disabled selected>Select your country</option>
                <option value="Burundi">🇧🇮 Burundi (+257)</option>
                <option value="Kenya">🇰🇪 Kenya (+254)</option>
                <option value="Uganda">🇺🇬 Uganda (+256)</option>
                <option value="Rwanda">🇷🇼 Rwanda (+250)</option>
                <option value="Tanzania">🇹🇿 Tanzania (+255)</option>
              </select>
            </div>

            <div class="modern-form-group">
              <label for="phone" class="modern-form-label">Phone Number</label>
              <input type="tel" id="phone" name="phone" class="modern-form-control" placeholder="e.g. 71234567" required />
            </div>

            <div class="modern-form-group">
              <label for="password" class="modern-form-label">Password</label>
              <input type="password" id="password" name="password" class="modern-form-control" placeholder="Create a password" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-green btn-full" id="register-btn" style="padding: 16px; margin-top: 10px;">
              Create Account
            </button>
          </form>

          <div style="margin-top: 32px; text-align: center; font-size: 15px; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary-blue); font-weight: 600;">Sign in</a>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
