<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Solar Africa</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-container" data-page="dashboard">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-container">
        <img src="assets/img/logo1.png" alt="Logo" style="height: 32px; border-radius: 6px;">
        <strong style="font-size: 18px;"><span class="logo-text-blue">SOLAR</span><span class="logo-text-green">AFRICA</span></strong>
      </div>
      <div class="header-meta">
        <div class="country-selector">
          <img src="https://flagcdn.com/w20/bi.png" alt="Burundi">
          <span>Burundi (BIF)</span>
        </div>
        <img src="https://ui-avatars.com/api/?name=User&background=random" style="width: 36px; height: 36px; border-radius: 50%;">
      </div>
    </header>

    <main class="main-content">
      <div class="dash-banner glass-panel" style="margin: 20px 5%;">
        <div class="banner-content">
          <h2>Welcome back</h2>
          <p>Your solar investments are growing 🚀</p>
        </div>
        <div class="user-profile-mini">
          <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User" id="user-avatar-mini">
        </div>
      </div>

      <div class="metrics-grid" style="padding: 0 5%;">
        <div class="m-card blue">
          <span>Wallet Balance</span>
          <strong id="wallet-balance">...</strong>
        </div>
        <div class="m-card green">
          <span>Welcome Bonus</span>
          <strong id="welcome-bonus">...</strong>
        </div>
        <div class="m-card white">
          <span>Total Earnings</span>
          <strong id="total-earnings">...</strong>
        </div>
        <div class="m-card white">
          <span>Active Package</span>
          <strong id="active-package" class="text-yellow">...</strong>
        </div>
      </div>

      <div class="chart-section premium-card" style="margin: 20px 5%;">
        <div class="chart-header">
          <h4>Earnings Growth</h4>
          <span class="badge up">↑ 12.5%</span>
        </div>
        <div id="wallet-chart" class="chart-canvas"></div>
      </div>

      <div class="quick-actions" style="padding: 0 5%; display: flex; gap: 16px;">
        <button id="deposit-btn" class="btn btn-blue btn-full">Deposit Funds</button>
        <button id="withdraw-btn" class="btn btn-outline btn-full">Withdraw</button>
      </div>

      <div style="padding: 24px 5%;">
        <div class="section-head">
          <h3>Recent Activity</h3>
        </div>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Dashboard
      </a>
      <a href="packages.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        Plans
      </a>
      <a href="team.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
        Referrals
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Me
      </a>
    </nav>

    <script src="assets/js/app.js" defer></script>
  </body>
</html>
