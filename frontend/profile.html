<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | Solar Africa</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-container" data-page="profile">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-container">
        <img src="assets/img/logo1.png" alt="Logo" style="height: 32px; border-radius: 6px;">
        <strong style="font-size: 18px;"><span class="logo-text-blue">SOLAR</span><span class="logo-text-green">AFRICA</span></strong>
      </div>
      <div class="header-meta">
        <div class="country-selector">
          <img src="https://flagcdn.com/w20/bi.png" alt="Burundi">
          <span>Burundi (BIF)</span>
        </div>
        <img src="https://ui-avatars.com/api/?name=User&background=random" style="width: 36px; height: 36px; border-radius: 50%;">
      </div>
    </header>

    <main class="main-content">
      <div class="profile-header" style="text-align: center; padding: 40px 5%; background: white; margin-bottom: 20px;">
        <img src="https://ui-avatars.com/api/?name=User&size=120&background=random" alt="Avatar" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 16px; border: 4px solid #f1f5f9;">
        <h2 id="profile-name" style="font-size: 20px; font-weight: 800;">Member User</h2>
        <p id="profile-phone" style="color: var(--text-muted); font-size: 14px;">+257 60 000 000</p>
      </div>

      <div style="padding: 0 5%;">
        <div class="premium-card" style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0;">
           <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
             <span>Personal Info</span>
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
           </div>
           <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
             <span>Investment History</span>
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
           </div>
           <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
             <span>Security Settings</span>
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
           </div>
           <div style="padding: 16px 20px; color: #ef4444; font-weight: 600; cursor: pointer;" id="logout-btn">
             Logout Account
           </div>
        </div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Dashboard
      </a>
      <a href="packages.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        Plans
      </a>
      <a href="team.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
        Referrals
      </a>
      <a href="profile.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Me
      </a>
    </nav>

    <script src="assets/js/app.js" defer></script>
  </body>
</html>
