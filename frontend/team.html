<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team | Solar Africa</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-container" data-page="team">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-container">
        <img src="assets/img/logo1.png" alt="Logo" style="height: 32px; border-radius: 6px;">
        <strong style="font-size: 18px;"><span class="logo-text-blue">SOLAR</span><span class="logo-text-green">AFRICA</span></strong>
      </div>
      <div class="header-meta">
        <div class="country-selector">
          <img src="https://flagcdn.com/w20/bi.png" alt="Burundi">
          <span>Burundi (BIF)</span>
        </div>
        <img src="https://ui-avatars.com/api/?name=User&background=random" style="width: 36px; height: 36px; border-radius: 50%;">
      </div>
    </header>

    <main class="main-content">
      <div style="padding: 24px 5% 0;">
        <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 4px;">Referral Team</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Invite your friends and earn bonuses for every investment they make.</p>
      </div>

      <div style="padding: 24px 5%;">
        <div class="team-container premium-card">
          <div class="ref-link-box">
            <h4>Your Referral Link</h4>
            <div class="link-input-group">
              <input type="text" id="ref-link" readonly value="https://solarafrica.com/ref/USER123" style="background: #f1f5f9; padding: 12px; border-radius: 8px; border: none; flex: 1;" />
              <button class="btn btn-blue" onclick="window.app.copyRef()">Copy</button>
            </div>
          </div>

          <div class="ref-stats-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px;">
            <div class="ref-stat-card" style="background: #f8fafc; padding: 16px; border-radius: 12px; text-align: center;">
              <span style="font-size: 12px; color: var(--text-muted);">Total Referrals</span>
              <strong id="ref-count" style="display: block; font-size: 20px;">0</strong>
            </div>
            <div class="ref-stat-card" style="background: #f8fafc; padding: 16px; border-radius: 12px; text-align: center;">
              <span style="font-size: 12px; color: var(--text-muted);">Active</span>
              <strong id="ref-active" style="display: block; font-size: 20px;">0</strong>
            </div>
            <div class="ref-stat-card" style="background: #f8fafc; padding: 16px; border-radius: 12px; text-align: center;">
              <span style="font-size: 12px; color: var(--text-muted);">Total Bonus</span>
              <strong id="ref-bonus" style="display: block; font-size: 20px; color: var(--primary-green);">0 BIF</strong>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Dashboard
      </a>
      <a href="packages.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        Plans
      </a>
      <a href="team.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
        Referrals
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Me
      </a>
    </nav>

    <script src="assets/js/app.js" defer></script>
  </body>
</html>
